name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.3', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: composer analyze

      - name: Run tests with coverage
        run: composer test:coverage

      - name: Enforce coverage threshold (80%)
        run: |
          if [ ! -f coverage/clover.xml ]; then
            echo "coverage/clover.xml was not generated."
            exit 1
          fi

          COVERAGE=$(php -r '$xml=simplexml_load_file("coverage/clover.xml");$m=$xml->project->metrics;$e=(float)$m["elements"];$c=(float)$m["coveredelements"];if($e<=0){echo "0";exit(0);}echo number_format(($c/$e)*100,2,".","");')
          echo "Coverage: ${COVERAGE}%"

          awk -v c="$COVERAGE" 'BEGIN { if (c < 80) { exit 1 } }' || {
            echo "Coverage threshold not met (minimum 80%)."
            exit 1
          }

  backward-compatibility:
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl

      - name: Determine PR baseline and BC policy
        id: bc_context
        run: |
          if [ "${{ github.head_ref }}" != "" ] && [ "${{ github.head_ref }}" != "null" ] && [[ "${{ github.head_ref }}" == release/v* ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=Major release branch detected (${{ github.head_ref }}); BC check skipped." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo '${{ toJson(github.event.pull_request.labels.*.name) }}' | grep -q 'major-release'; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=PR labeled major-release; BC check skipped." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASELINE_SHA="$(git merge-base HEAD origin/${{ github.base_ref }})"
          echo "baseline_sha=${BASELINE_SHA}" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "skip_reason=" >> "$GITHUB_OUTPUT"

      - name: Install backward compatibility checker
        if: steps.bc_context.outputs.should_run == 'true'
        run: |
          mkdir -p /tmp/roave-bc
          composer init --no-interaction --name ci/roave-bc --working-dir=/tmp/roave-bc
          composer require --no-interaction --working-dir=/tmp/roave-bc roave/backward-compatibility-check:^8.0

      - name: Run backward compatibility check
        if: steps.bc_context.outputs.should_run == 'true'
        run: |
          BASELINE="${{ steps.bc_context.outputs.baseline_sha }}"
          echo "Checking backward compatibility from ${BASELINE} to HEAD"
          /tmp/roave-bc/vendor/bin/roave-backward-compatibility-check --from="${BASELINE}" --to="HEAD"

      - name: Skip backward compatibility check
        if: steps.bc_context.outputs.should_run != 'true'
        run: echo "${{ steps.bc_context.outputs.skip_reason }}"
