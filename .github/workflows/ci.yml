name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.3', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: composer analyze

      - name: Run tests with coverage
        run: composer test:coverage

      - name: Enforce coverage threshold (80%)
        run: |
          if [ ! -f coverage/clover.xml ]; then
            echo "coverage/clover.xml was not generated."
            exit 1
          fi

          COVERAGE=$(php -r '$xml=simplexml_load_file("coverage/clover.xml");$m=$xml->project->metrics;$e=(float)$m["elements"];$c=(float)$m["coveredelements"];if($e<=0){echo "0";exit(0);}echo number_format(($c/$e)*100,2,".","");')
          echo "Coverage: ${COVERAGE}%"

          awk -v c="$COVERAGE" 'BEGIN { if (c < 80) { exit 1 } }' || {
            echo "Coverage threshold not met (minimum 80%)."
            exit 1
          }

  backward-compatibility:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install base dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install backward compatibility checker
        run: composer require --dev roave/backward-compatibility-check:^8.0

      - name: Run backward compatibility check
        run: |
          echo "Checking backward compatibility from origin/main..."
          vendor/bin/roave-backward-compatibility-check --from=origin/main
